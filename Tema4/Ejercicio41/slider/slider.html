<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8"/>
    <title>Amazing Slider</title>
    
    <!-- Insert to your webpage before the </head> -->
    <script src="sliderengine/jquery.js"></script>
    <script src="sliderengine/amazingslider.js"></script>
    <script src="sliderengine/initslider-1.js"></script>
    <!-- End of head section HTML codes -->
    
</head>
<body>
<div style="margin:30px auto;max-width:600px;">
    
    <!-- Insert to your webpage where you want to display the slider -->
    <div id="amazingslider-1" style="display:block;position:relative;margin:16px auto 56px;">
        <ul class="amazingslider-slides" style="display:none;">
            <li><img src="images/Captura de pantalla 2025-10-03 112904.png" alt="Captura de pantalla 2025-10-03 112904" /></li>
            <li><img src="images/Captura de pantalla 2025-12-17 121235.png" alt="Captura de pantalla 2025-12-17 121235" /></li>
            <li><img src="images/Captura de pantalla 2025-10-22 082455.png" alt="Captura de pantalla 2025-10-22 082455" /></li>
        </ul>
        <ul class="amazingslider-thumbnails" style="display:none;">
            <li><img src="images/Captura de pantalla 2025-10-03 112904-tn.png" /></li>
            <li><img src="images/Captura de pantalla 2025-12-17 121235-tn.png" /></li>
            <li><img src="images/Captura de pantalla 2025-10-22 082455-tn.png" /></li>
        </ul>
        <div class="amazingslider-engine" style="display:none;"><a href="http://amazingslider.com">jQuery Image Slider</a></div>
    </div>
    <!-- End of body section HTML codes -->
    
</div>
</body>
</html>
