<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="lightbox/css/lightbox.css">
    <link rel="stylesheet" href="lightbox/css/screen.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio </title>
</head>
<body>
    <section id="examples" class="examples-section">
      <div class="container">
        <h2>Cielos nocturnos</h2>
        <h3>Ejemplo de 2 imagenes</h3>
        <div class="image-row">
          <a
            class="example-image-link"
            href="img/noche_2.jpg"
            data-lightbox="example-1"
            ><img
              class="example-image"
              src="img/noche_2.jpg"
              alt="image-1"
          /></a>
          <a
            class="example-image-link"
            href="img/noche_1.jpg"
            data-lightbox="example-2"
            data-title="Optional caption."
            ><img
              class="example-image"
              src="img/noche_1.jpg"
              alt="image-1"
          /></a>
        </div>

        <hr />

        <h3 style="clear: both">Ejemplo de 4 imagenes</h3>

        <div class="image-row">
          <div class="image-set">
            <a
              class="example-image-link"
              href="img/noche_3.jpg"
              data-lightbox="example-set"
              data-title="Click the right half of the image to move forward."
              ><img class="example-image" src="img/noche_3.jpg" alt=""
            /></a>
            <a
              class="example-image-link"
              href="img/noche_4.jpg"
              data-lightbox="example-set"
              data-title="Or press the right arrow on your keyboard."
              ><img class="example-image" src="img/noche_4.jpg" alt=""
            /></a>
            <a
              class="example-image-link"
              href="img/noche_5.jpg"
              data-lightbox="example-set"
              data-title="The next image in the set is preloaded as you're viewing."
              ><img class="example-image" src="img/noche_5.jpg" alt=""
            /></a>
            <a
              class="example-image-link"
              href="img/noche_6.jpg"
              data-lightbox="example-set"
              data-title="Click anywhere outside the image or the X to the right to close."
              ><img class="example-image" src="img/noche_6.jpg" alt=""
            /></a>
          </div>
        </div>
      </div>
    </section>
    <script>
        !(function (d, s, id) {
          var js,
            fjs = d.getElementsByTagName(s)[0],
            p = /^http:/.test(d.location) ? "http" : "https";

            js.id = id;
            js.src = p + "://platform.twitter.com/widgets.js";
            fjs.parentNode.insertBefore(js, fjs);
          }
        })(document, "script", "twitter-wjs");
      </script>
    </div>

    <script src="lightbox/js/jquery-1.11.0.min.js"></script>
    <script src="lightbox/js/lightbox.js"></script>

        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(ga, s);
      })();
    </script>
</body>
</html>
