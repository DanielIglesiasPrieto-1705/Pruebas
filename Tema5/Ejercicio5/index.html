<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 32</title>
  </head>
  <body>
    <h1>Formulario de contacto</h1>
    <form id="form" action="datos.txt" method="get">
      <label for="nombre">Nombre y Apellido (*)</label>
      <br />
      <input type="text" id="nombre" size="30" name="nombre" />
      <hr />
      <label for="email">Email (*)</label>
      <br />
      <input
        pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{3,}$"
        type="email"
        id="email"
        name="email"
        size="30"
      />
      <hr />
      <label for="genero">Genero</label>
      <br />
      <input type="radio" name="genero" value="Hombre" />
      <label for="genero">Hombre</label>
      <input type="radio" name="genero" value="Mujer" />
      <label for="genero">Mujer</label>
      <hr />
      <label for="intereses">Intereses</label>
      <br />
      <input id="check" type="checkbox" value="Deporte" name="intereses" />
      <label for="intereses">Deporte</label>
      <input id="check" type="checkbox" value="Politica" name="intereses" />
      <label for="intereses">Politica</label>
      <input id="check" type="checkbox" value="Ciencia" name="intereses" />
      <label for="intereses">Ciencia</label>
      <hr />
      <label for="comentarios">Comentarios</label>
      <br />
      <textarea name="comentarios" id="comentarios"></textarea>
      <br />
      <label id="aviso">Campos requridos (*)</label>
      <div id="error"></div>
      <br />
      <input type="submit" value="Enviar Datos" />
      <input type="reset" value="Borrar campos" />
    </form>
  </body>
</html>
