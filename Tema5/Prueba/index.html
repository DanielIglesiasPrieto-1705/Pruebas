<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/main.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validación de formularios</title>
  </head>
  <body>
    <form action="" id="formulario">
      <div>

    <div id="error"></div>
  </body>
