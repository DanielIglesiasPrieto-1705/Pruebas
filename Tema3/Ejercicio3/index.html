<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <form action="" method="get">
        <div>
            <label for="email">Ingrese su mail:</label>
            <input type="email" id="email" name="email" size="50" required>
        </div>
        <div>
            <label for="clave">Ingrese su clave:</label>
            <input type="password" id="clave" name="clave" size="12" required>
        </div>
        <div>
            <label for="clave2">Repita el ingreso de su clave:</label>
            <input type="password" id="clave2" size="12" name="clave2" required>
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">
        </div>
    </form>
</body>
</html>
